tensight_haus_kinder:
  target: prod
  outputs:
    prod:
      type: athena
      s3_staging_dir: "{{ env_var('DBT_S3_STAGING_DIR') }}"
      s3_data_dir: "{{ env_var('DBT_S3_DATA_DIR') }}"
      region_name: ap-south-1
      database: awsdatacatalog
      schema: "{{ env_var('DBT_SCHEMA') }}"
      work_group: primary
      aws_access_key_id: "{{ env_var('DBT_AWS_ACCESS_KEY_ID') }}"
      aws_secret_access_key: "{{ env_var('DBT_AWS_SECRET_ACCESS_KEY') }}"
