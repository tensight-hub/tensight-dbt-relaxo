services:
  - type: cron
    name: tensight-haus-kinder-dbt
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 2 * * *"  # daily at 2:00 AM UTC — adjust as needed
    startCommand: bash run.sh
    envVars:
      - key: DBT_AWS_ACCESS_KEY_ID
        sync: false  # set this secret in the Render.com dashboard
      - key: DBT_AWS_SECRET_ACCESS_KEY
        sync: false  # set this secret in the Render.com dashboard
      - key: DBT_S3_STAGING_DIR
        value: s3://tensight-dbt-athena-staging/metadata_relaxo/
      - key: DBT_S3_DATA_DIR
        value: s3://tensight-dbt-athena-staging/prod_data_tables_relaxo/
      - key: DBT_SCHEMA
        value: custom_tensight_relaxo_agg_prod
